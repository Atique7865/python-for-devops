<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>তোমাকে ভীষণ মনে পড়ছে</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;600;800&family=Hind+Siliguri:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2e081d 0%, #12030c 70%, #050004 100%);
      font-family: 'Hind Siliguri', sans-serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      padding: 20px;
    }

    /* রোমান্টিক নরম ব্যাকগ্রাউন্ড আলো */
    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 51, 102, 0.3) 0%, rgba(255, 133, 162, 0.08) 50%, transparent 70%);
      filter: blur(60px);
      border-radius: 50%;
      z-index: 1;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.9);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 650px;
    }

    /* মূল বাংলা লেখা */
    .text {
      font-family: 'Anek Bangla', 'Hind Siliguri', sans-serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #ffccd5 40%, #ff4d79 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 77, 121, 0.4);
      line-height: 1.3;
      letter-spacing: 1px;
      animation: textFloat 3s ease-in-out infinite alternate;
    }

    @keyframes textFloat {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-10px);
      }
    }

    /* স্পর্শ করার টিপস */
    .hint {
      margin-top: 40px;
      font-size: 0.85rem;
      color: rgba(255, 204, 213, 0.4);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* ক্লিক বা স্পর্শের পর ভেসে ওঠা কণা */
    .particle {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      animation: floatUp 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      50% {
        opacity: 0.9;
        transform: translate(calc(-50% + var(--x-drift)), calc(-50% - 80px)) scale(1.3) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x-drift)), calc(-50% - 160px)) scale(0.6) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="container">
    <h1 class="text">তোমাকে ভীষণ মনে পড়ছে</h1>
    <div class="hint">✨ যেকোনো স্থানে স্পর্শ করুন ✨</div>
  </div>

  <script>
    const symbols = ['❤️', '💖', '💗', '💕', '✨', '🌹', '💭'];

    document.addEventListener('click', (e) => {
      for (let i = 0; i < 3; i++) {
        createParticle(e.clientX, e.clientY);
      }
    });

    function createParticle(x, y) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      particle.style.fontSize = `${Math.random() * 1.2 + 1.2}rem`;

      const xDrift = (Math.random() - 0.5) * 120 + 'px';
      const rotation = (Math.random() - 0.5) * 90 + 'deg';

      particle.style.setProperty('--x-drift', xDrift);
      particle.style.setProperty('--rot', rotation);

      document.body.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 1800);
    }
  </script>

</body>
</html>
