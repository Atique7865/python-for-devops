<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>তোমাকে ভীষণ মনে পড়ছে</title>

  <!-- Browser Tab Logo (Favicon) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27><defs><linearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27><stop stop-color=%27%23ff4d79%27/><stop offset=%271%27 stop-color=%27%23ffb3c7%27/></linearGradient></defs><circle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27url(%23g)%27/><text x=%2750%25%27 y=%2758%25%27 text-anchor=%27middle%27 font-size=%2732%27>💖</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700;800&family=Hind+Siliguri:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      font-family:'Hind Siliguri',sans-serif;
      background:linear-gradient(-45deg,#12000a,#2d0018,#3a001f,#12000a);
      background-size:400% 400%;
      animation:bgMove 15s ease infinite;
      cursor:pointer;
      padding:20px 0;
    }

    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .glow{
      position:fixed;
      border-radius:50%;
      filter:blur(100px);
      opacity:.35;
      animation:float 10s ease-in-out infinite alternate;
      pointer-events:none;
    }

    .g1{
      width:420px;
      height:420px;
      background:#ff3d7f;
      top:-120px;
      left:-100px;
    }

    .g2{
      width:380px;
      height:380px;
      background:#ff8db0;
      bottom:-120px;
      right:-80px;
      animation-delay:2s;
    }

    @keyframes float{
      from{transform:translateY(0) translateX(0) scale(1);}
      to{transform:translateY(-30px) translateX(30px) scale(1.1);}
    }

    #stars{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      pointer-events:none;
    }

    .card{
      position:relative;
      z-index:5;
      width:min(92%,720px);
      max-height:88vh;
      overflow-y:auto;
      padding:40px 30px;
      text-align:center;
      border-radius:36px;
      background:rgba(255,255,255,.06);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:
        0 25px 60px rgba(0,0,0,.55),
        inset 0 0 30px rgba(255,255,255,.05),
        0 0 40px rgba(255,77,121,.25);
      transition:transform .25s ease;
    }

    /* Custom Scrollbar for Card */
    .card::-webkit-scrollbar {
      width:6px;
    }
    .card::-webkit-scrollbar-thumb {
      background:rgba(255,77,121,0.4);
      border-radius:10px;
    }
    .card::-webkit-scrollbar-track {
      background:transparent;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:38px;
      background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,77,121,.25),rgba(255,255,255,.08));
      z-index:-1;
      filter:blur(12px);
    }

    /* Logo Styling */
    .logo-wrapper{
      display:flex;
      justify-content:center;
      margin-bottom:18px;
    }

    .logo-circle{
      position:relative;
      width:90px;
      height:90px;
      border-radius:50%;
      background:linear-gradient(135deg,rgba(255,255,255,0.18),rgba(255,77,121,0.28));
      border:2px solid rgba(255,255,255,0.25);
      display:flex;
      justify-content:center;
      align-items:center;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 0 35px rgba(255,77,121,0.45), inset 0 0 18px rgba(255,255,255,0.12);
      animation:logoFloat 4s ease-in-out infinite;
    }

    .logo-circle::before{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:50%;
      background:linear-gradient(135deg,#ff4d79,#ffb3c7,#ffffff);
      z-index:-1;
      opacity:.45;
      filter:blur(14px);
    }

    .logo-heart{
      font-size:2rem;
      position:absolute;
      animation:logoBeat 1.8s ease-in-out infinite;
      filter:drop-shadow(0 0 12px #ff4d79);
    }

    .logo-rose{
      position:absolute;
      bottom:8px;
      right:10px;
      font-size:1rem;
    }

    @keyframes logoBeat{
      0%,100%{transform:scale(1);}
      25%{transform:scale(1.15);}
      50%{transform:scale(1);}
      75%{transform:scale(1.08);}
    }

    @keyframes logoFloat{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-8px);}
    }

    .script{
      font-family:'Great Vibes',cursive;
      font-size:2.1rem;
      color:#ffb5c9;
      margin-bottom:8px;
    }

    .heart{
      font-size:3.2rem;
      margin:8px 0 16px;
      display:inline-block;
      animation:beat 1.5s ease-in-out infinite;
      filter:drop-shadow(0 0 20px #ff4d79);
    }

    @keyframes beat{
      0%,100%{transform:scale(1);}
      20%{transform:scale(1.25);}
      40%{transform:scale(1);}
      60%{transform:scale(1.18);}
    }

    .title{
      font-family:'Anek Bangla',sans-serif;
      font-size:clamp(2.4rem, 6vw, 4.2rem);
      font-weight:800;
      line-height:1.2;
      background:linear-gradient(135deg,#ffffff,#ffe8ee,#ff9bb7,#ff4d79,#ffd9e2);
      background-size:250% auto;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:shine 6s linear infinite;
      text-shadow:0 0 35px rgba(255,77,121,.45);
    }

    @keyframes shine{
      from{background-position:0% center;}
      to{background-position:250% center;}
    }

    .divider{
      width:120px;
      height:2px;
      margin:20px auto;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
      border-radius:999px;
    }

    .subtitle{
      margin-top:16px;
      font-size:1.05rem;
      line-height:1.8;
      color:rgba(255,235,240,.88);
      font-weight:300;
    }

    .special-line{
      margin-top:18px;
      font-size:1.35rem;
      color:#ffb5c9;
      animation:beat 2s ease infinite;
    }

    .hint{
      margin-top:26px;
      font-size:.8rem;
      letter-spacing:3px;
      color:rgba(255,220,228,.55);
      text-transform:uppercase;
    }

    .floating-heart{
      position:fixed;
      bottom:-30px;
      pointer-events:none;
      animation:rise linear forwards;
      z-index:2;
    }

    @keyframes rise{
      from{transform:translateY(0) scale(.8);opacity:0;}
      10%{opacity:.9;}
      to{transform:translateY(-115vh) translateX(var(--drift)) scale(1.35);opacity:0;}
    }

    @media (max-width:640px){
      .card{padding:30px 20px;}
      .script{font-size:1.8rem;}
      .heart{font-size:2.8rem;}
      .special-line{font-size:1.15rem;}
    }
  </style>
</head>
<body>

  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <canvas id="stars"></canvas>

  <div class="card" id="card">

    <div class="logo-wrapper">
      <div class="logo-circle">
        <span class="logo-heart">💖</span>
        <span class="logo-rose">🌹</span>
      </div>
    </div>

    <div class="script">Thinking of you every heartbeat</div>

    <div class="heart">💖</div>

    <h1 class="title">তোমাকে ভীষণ মনে পড়ছে</h1>

    <div class="divider"></div>

    <p class="subtitle">
      তোমার হাসি, তোমার কথা, তোমার সেই ছোট ছোট মুহূর্তগুলো
      আজও আমার চারপাশে ভেসে বেড়ায়। দূরে থেকেও তুমি যেন
      আমার প্রতিটি নিঃশ্বাসের খুব কাছেই আছো। 🌹
    </p>

    <div class="special-line">
      💌 তুমি থাকো আমার হৃদয়ের সবচেয়ে সুন্দর জায়গায়
    </div>

    <div class="hint">✨ স্ক্রিনে স্পর্শ করুন ✨</div>
  </div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');

    let w = canvas.width = innerWidth;
    let h = canvas.height = innerHeight;

    addEventListener('resize', () => {
      w = canvas.width = innerWidth;
      h = canvas.height = innerHeight;
    });

    const stars = Array.from({length:120}, () => ({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.8,
      s: Math.random()*0.7 + 0.2
    }));

    function drawStars(){
      ctx.clearRect(0,0,w,h);

      for(const star of stars){
        star.y -= star.s;

        if(star.y < 0){
          star.y = h;
          star.x = Math.random()*w;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.fill();
      }

      requestAnimationFrame(drawStars);
    }

    drawStars();

    const heartPool = ['❤️','💖','💕','💗','🌹','✨'];

    function spawnHeart(){
      const el = document.createElement('div');
      el.className = 'floating-heart';
      el.textContent = heartPool[Math.floor(Math.random()*heartPool.length)];

      el.style.left = Math.random()*100 + 'vw';
      el.style.fontSize = (Math.random()*1.6 + 1.1) + 'rem';
      el.style.animationDuration = (Math.random()*5 + 7) + 's';
      el.style.setProperty('--drift',(Math.random()*120 - 60) + 'px');

      document.body.appendChild(el);
      setTimeout(() => el.remove(),12000);
    }

    setInterval(spawnHeart,900);
  </script>

</body>
</html>
