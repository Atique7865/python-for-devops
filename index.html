<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>তোমাকে ভীষণ মনে পড়ছে</title>

  <!-- Google Fonts: Elegant Bengali Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700;800&family=Hind+Siliguri:wght@300;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2e051a 0%, #11020b 60%, #050003 100%);
      font-family: 'Hind Siliguri', sans-serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    /* Floating Ambient Background Orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 1;
      pointer-events: none;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      background: rgba(255, 51, 102, 0.28);
      top: 15%;
      left: 20%;
      animation: floatOrb 8s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: rgba(255, 133, 162, 0.2);
      bottom: 10%;
      right: 18%;
      animation: floatOrb 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(0.9);
      }
      100% {
        transform: translate(40px, -40px) scale(1.15);
      }
    }

    /* Ambient Canvas for Floating Background Petals/Stars */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Glassmorphic Central Card */
    .glass-card {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 65px 45px;
      max-width: 700px;
      width: 90%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 182, 193, 0.25);
      border-radius: 32px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        inset 0 0 20px rgba(255, 255, 255, 0.08),
        0 0 35px rgba(255, 51, 102, 0.2);
      animation: cardEntrance 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Top Decorative English Script Accent */
    .english-accent {
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: #ff85a2;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-shadow: 0 0 12px rgba(255, 133, 162, 0.6);
      opacity: 0.9;
    }

    /* Glowing 3D Heart Element */
    .heart-icon {
      font-size: 3rem;
      margin: 15px 0 25px;
      display: inline-block;
      animation: heartBeat 1.4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px #ff3366);
    }

    @keyframes heartBeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.25);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.18);
      }
    }

    /* Main Shimmering Gradient Typography */
    .main-text {
      font-family: 'Anek Bangla', 'Hind Siliguri', sans-serif;
      font-size: clamp(3rem, 7vw, 5.2rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #ffe6eb 30%, #ff4d79 70%, #ff85a2 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(255, 77, 121, 0.5);
      line-height: 1.25;
      letter-spacing: 1px;
      animation: shineGradient 5s ease infinite alternate;
    }

    @keyframes shineGradient {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 100% 50%;
      }
    }

    /* Subtext Hint */
    .hint {
      margin-top: 35px;
      font-size: 0.85rem;
      color: rgba(255, 204, 213, 0.5);
      letter-spacing: 2px;
      font-weight: 300;
      text-transform: uppercase;
    }

    /* Interactive Click Particles */
    .particle {
      position: absolute;
      pointer-events: none;
      z-index: 999;
      animation: floatAway 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes floatAway {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: translate(calc(-50% + var(--x-drift)), calc(-50% - 90px)) scale(1.3) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x-drift)), calc(-50% - 180px)) scale(0.6) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Background Canvas for Floating Particles -->
  <canvas id="bg-canvas"></canvas>

  <!-- Central Glassmorphism Card -->
  <div class="glass-card">
    <div class="english-accent">Thinking of you every second</div>
    <div class="heart-icon">💖</div>
    <h1 class="main-text">তোমাকে ভীষণ মনে পড়ছে</h1>
    <div class="hint">✨ স্ক্রিনে স্পর্শ করুন ✨</div>
  </div>

  <script>
    /* Canvas Floating Particles (Stars/Petals) Background */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const bgParticles = [];
    const numBgParticles = 45;

    class BgParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height + height;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 0.8 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.6 + 0.2;
      }

      update() {
        this.y -= this.speedY;
        this.x += this.speedX;

        if (this.y < -10) {
          this.reset();
          this.y = height + 10;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 182, 193, ${this.opacity})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff3366';
        ctx.fill();
      }
    }

    for (let i = 0; i < numBgParticles; i++) {
      const p = new BgParticle();
      p.y = Math.random() * height; // initial spread
      bgParticles.push(p);
    }

    function animateBg() {
      ctx.clearRect(0, 0, width, height);
      bgParticles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateBg);
    }

    animateBg();

    /* Interactive Click Burst Effect */
    const interactiveSymbols = ['❤️', '💖', '💗', '💕', '✨', '🌹', '💌'];

    document.addEventListener('click', (e) => {
      for (let i = 0; i < 4; i++) {
        createInteractiveParticle(e.clientX, e.clientY);
      }
    });

    function createInteractiveParticle(x, y) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.innerHTML = interactiveSymbols[Math.floor(Math.random() * interactiveSymbols.length)];
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      particle.style.fontSize = `${Math.random() * 1.3 + 1.2}rem`;

      const xDrift = (Math.random() - 0.5) * 140 + 'px';
      const rotation = (Math.random() - 0.5) * 90 + 'deg';

      particle.style.setProperty('--x-drift', xDrift);
      particle.style.setProperty('--rot', rotation);

      document.body.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 1800);
    }
  </script>

</body>
</html>
